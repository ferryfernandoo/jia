<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Jia 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe1ee;--bg2:#e6d6ff;--soft:#a3507c;--pink:#ff4f93;--shadow:rgba(160,60,115,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1033;--bg2:#141240;--soft:#ffc6df;--shadow:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg1:#2b1033;--bg2:#141240;--soft:#ffc6df;--shadow:rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--soft);font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;bottom:-60px;font-style:normal;opacity:.75;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(24px,-58vh) rotate(18deg)}100%{transform:translate(-12px,-125vh) rotate(-14deg)}}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
h1{margin:0;font:400 clamp(30px,8vw,42px)/1.1 'Pacifico',cursive;color:var(--pink);text-shadow:0 3px 0 rgba(255,255,255,.7),0 10px 24px var(--shadow);animation:pop 1s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.scene{perspective:1100px;width:min(82vw,340px);height:min(58vh,470px);height:min(58svh,470px);touch-action:pan-y;cursor:pointer}
.deck{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.card{position:absolute;inset:0;perspective:1000px;transform:translate3d(0,calc(var(--d)*16px),calc(var(--d)*-70px));transition:transform .75s cubic-bezier(.2,.9,.25,1.05),opacity .5s}
.card.gone{transform:translate3d(-135%,-30px,90px) rotateZ(-20deg) rotateY(30deg);opacity:0;pointer-events:none}
.card.hide{opacity:0;pointer-events:none}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.2,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;box-shadow:0 22px 40px var(--shadow),inset 0 0 0 6px rgba(255,255,255,.8)}
.front{background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.7),transparent 45%),linear-gradient(150deg,var(--c1),var(--c2))}
.front::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.5) 49%,transparent 60%);background-size:260% 100%;animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.num{position:absolute;top:20px;left:24px;font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(150,40,100,.4)}
.emoji{font-size:112px;line-height:1;filter:drop-shadow(0 14px 12px rgba(130,40,90,.32));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
h2{margin:10px 18px 0;font:400 34px/1.15 'Pacifico',cursive;color:#fff;text-shadow:0 3px 0 rgba(190,60,120,.45),0 8px 18px rgba(150,40,100,.4)}
.tap{position:absolute;bottom:22px;font-size:15px;font-weight:600;color:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.back{transform:rotateY(180deg);background:radial-gradient(#ffd5e6 2.2px,transparent 2.8px) 0 0/24px 24px,#fffaf5;padding:30px 26px;color:#5b2a48}
.ico{font-size:40px;margin-bottom:10px}
.back p{margin:0;font-size:22px;line-height:1.4;font-weight:600;max-width:24ch}
.sign{margin-top:18px;font:400 24px 'Pacifico',cursive;color:var(--pink)}
.nav{display:flex;align-items:center;gap:18px;font-weight:800;font-size:17px}
.btn{width:56px;height:56px;border-radius:50%;border:0;background:#fff;color:#ff4f93;font-size:26px;font-weight:800;box-shadow:0 10px 22px var(--shadow),inset 0 -4px 0 #ffd3e5;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.88)}
.btn:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.hint{font-size:14px;margin:-4px 0 0;opacity:.85;text-align:center;padding:0 24px}
.mus{width:48px;height:48px;font-size:22px}
.p{position:fixed;font-size:24px;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){#bg i,.emoji,.front::before,.tap{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <h1>Untuk Jia 💗</h1>
  <div class="scene" id="scene"><div class="deck" id="deck"></div></div>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Kartu sebelumnya">‹</button>
    <span id="cnt">1 / 8</span>
    <button class="btn" id="next" aria-label="Kartu berikutnya">›</button>
    <button class="btn mus" id="mus" aria-label="Nyalakan musik">🎵</button>
  </div>
  <p class="hint">Ketuk kartu untuk dibalik, geser untuk lanjut. Musik nyala setelah ketukan pertama 🎵</p>
</main>
<script>
const C=[
{e:'💌',t:'Hai, Jia!',a:'#ffc4dc',b:'#ff9fc4',m:'Aku bikin kartu kecil ini khusus buat kamu. Buka satu-satu ya, pelan-pelan 💗'},
{e:'☀️',t:'Senyummu',a:'#ffe7a8',b:'#ffb7a1',m:'Senyum kamu itu kayak matahari pagi. Bikin hari yang capek jadi terasa ringan.'},
{e:'🏡',t:'Tempat pulang',a:'#ffd0e4',b:'#d9b8ff',m:'Di dekat kamu, aku ngerasa pulang. Tenang, hangat, dan nggak perlu jadi siapa-siapa.'},
{e:'⭐',t:'Bintangku',a:'#d6c8ff',b:'#ffb8da',m:'Kalau semua bintang dikumpulin pun, nggak ada yang lebih terang dari kamu di mataku.'},
{e:'🍯',t:'Makasih ya',a:'#ffe0b8',b:'#ffb4c8',m:'Makasih udah sabar, udah percaya, dan udah selalu ada. Kamu hal terbaik yang datang ke hidupku.'},
{e:'🐣',t:'Kamu lucu!',a:'#fff1a8',b:'#ffc2d8',m:'Kamu tuh lucu banget, sumpah. Cemberutmu aja bikin aku pengin langsung peluk.'},
{e:'🌷',t:'Janjiku',a:'#ffc8d8',b:'#c9e8ff',m:'Aku mau jagain kamu, dengerin ceritamu, dan ngerayain hal kecil bareng kamu setiap hari.'},
{e:'💖',t:'Cuma satu',a:'#ff9cc4',b:'#c9a8ff',m:'Aku sayang kamu, Jia. Hari ini, besok, dan seterusnya. Selalu 💖',s:'Ferry 🧸'}
];
const H=['💗','💖','💕','🌸','✨','🤍','🫧'];
const deck=document.getElementById('deck'),scene=document.getElementById('scene'),cnt=document.getElementById('cnt');
C.forEach((c,k)=>{const el=document.createElement('div');el.className='card';
el.innerHTML='<div class="inner"><div class="face front" style="--c1:'+c.a+';--c2:'+c.b+'"><span class="num">'+(k+1)+'/'+C.length+'</span><div class="emoji">'+c.e+'</div><h2>'+c.t+'</h2><span class="tap">ketuk untuk dibuka 💌</span></div><div class="face back"><div class="ico">'+c.e+'</div><p>'+c.m+'</p>'+(c.s?'<div class="sign">'+c.s+'</div>':'')+'</div></div>';
deck.append(el)});
const cards=[...deck.children];let i=0;
function render(){cards.forEach((el,k)=>{const d=k-i;el.classList.toggle('gone',d<0);el.classList.toggle('hide',d>3);el.style.setProperty('--d',Math.max(0,Math.min(d,3)))});cnt.textContent=(i+1)+' / '+C.length}
function go(dir){if(dir>0&&i===C.length-1){cards.forEach(c=>c.classList.remove('flip'));i=0}else{const n=Math.max(0,Math.min(C.length-1,i+dir));if(dir<0)cards[n].classList.remove('flip');i=n}render()}
function burst(){const r=deck.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
for(let k=0;k<40;k++){const p=document.createElement('span');p.className='p';p.textContent=H[k%H.length];p.style.left=cx+'px';p.style.top=cy+'px';document.body.append(p);
const a=Math.random()*Math.PI*2,d=110+Math.random()*190;
p.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d-90)+'px)) scale('+(1+Math.random())+') rotate('+Math.random()*120+'deg)',opacity:0}],{duration:1400+Math.random()*900,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}}
function flip(){const c=cards[i];c.classList.toggle('flip');if(i===C.length-1&&c.classList.contains('flip'))setTimeout(burst,380)}
let sx=null;
scene.addEventListener('pointerdown',e=>{sx=e.clientX});
scene.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(auto){auto=false;musicOn()}if(Math.abs(dx)>50)go(dx<0?1:-1);else flip()});
scene.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;deck.style.setProperty('--ry',(x*20)+'deg');deck.style.setProperty('--rx',(-y*14)+'deg')});
scene.addEventListener('pointerleave',()=>{deck.style.setProperty('--ry','0deg');deck.style.setProperty('--rx','0deg')});
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key===' '){e.preventDefault();flip()}});
let ac,mg,tm,on=false,auto=true,st=0,nt=0;
const mus=document.getElementById('mus');
const F=m=>440*Math.pow(2,(m-69)/12);
const CH=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
const ML=[[76,0,79,0,84,0,79,76],[76,0,81,0,84,0,81,76],[77,0,81,0,84,0,81,77],[74,0,79,0,83,0,79,74],[79,0,84,0,88,0,84,79],[81,0,84,0,88,0,84,81],[84,0,81,0,77,0,81,84],[83,0,79,0,74,0,79,0]];
function tone(f,t,d,v){[[1,'sine',1],[2,'triangle',.25]].forEach(([k,ty,w])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f*k;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*w,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)})}
function step(t){const b=Math.floor(st/8)%8,p=st%8,c=CH[b%4];if(p===0)tone(F(c[0]-12),t,1.6,.16);tone(F(c[p%3]+12),t,.7,.05);const m=ML[b][p];if(m)tone(F(m),t,1.1,.13);st++}
function initAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=0;const d=ac.createDelay(),fb=ac.createGain(),lp=ac.createBiquadFilter();d.delayTime.value=.27;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=3200;mg.connect(ac.destination);mg.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(ac.destination)}
function musicOn(){try{if(!ac)initAudio();ac.resume();on=true;mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setTargetAtTime(.8,ac.currentTime,.3);nt=ac.currentTime+.1;clearInterval(tm);tm=setInterval(()=>{while(nt<ac.currentTime+.4){step(nt);nt+=.36}},100);mus.textContent='🔊';mus.setAttribute('aria-label','Matikan musik')}catch(e){}}
function musicOff(){if(!ac)return;on=false;clearInterval(tm);mg.gain.setTargetAtTime(0,ac.currentTime,.15);mus.textContent='🔇';mus.setAttribute('aria-label','Nyalakan musik')}
mus.onclick=()=>{auto=false;on?musicOff():musicOn()};
document.addEventListener('visibilitychange',()=>{if(!ac||!on)return;document.hidden?ac.suspend():ac.resume()});
const bg=document.getElementById('bg');
for(let k=0;k<22;k++){const s=document.createElement('i');s.textContent=H[k%H.length];s.style.cssText='left:'+Math.random()*100+'%;font-size:'+(14+Math.random()*26)+'px;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+Math.random()*18+'s';bg.append(s)}
render();
</script>
</body>
</html>
